[project]
name = "linhvuong"
version = "1.1.0"
description = "Bot Gọi Dân, Thảo Phạt, Bình Man cho game Linh Vương"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PySocks>=1.7.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "cryptography>=42.0",
]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
linhvuong = "linhvuong.cli:main"
linhvuong-web = "linhvuong.web.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["linhvuong", "linhvuong.tasks", "linhvuong.dashboard", "linhvuong.web"]

[tool.setuptools.package-data]
"linhvuong.web" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
