[project]
name = "linhvuong"
version = "1.0.3"
description = "Bot Gọi Dân, Thảo Phạt, Bình Man cho game Linh Vương"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PySocks>=1.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
linhvuong = "linhvuong.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["linhvuong", "linhvuong.tasks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
